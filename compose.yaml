services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: cookbook-postgres
    environment:
      POSTGRES_DB: cookbook
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
    ports:
      - '5432:5432'
    volumes:
      - cookbook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U cookbook -d cookbook' ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cookbook-pgdata:

