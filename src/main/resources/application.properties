spring.application.name=CookBook
# PaaS platforms (Render, Koyeb, Fly) inject the listening port via PORT.
server.port=${PORT:8085}

# ---------------------------------------------------------------
# Datasource (PostgreSQL) - overridable via environment variables
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cookbook}
spring.datasource.username=${DB_USERNAME:cookbook}
spring.datasource.password=${DB_PASSWORD:cookbook}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=cookbook-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------
# JPA / Hibernate - schema is owned by Flyway, never by Hibernate
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# Flyway migrations (src/main/resources/db/migration)
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Flyway takes session-level advisory locks, which do not survive PgBouncer
# transaction pooling. When the datasource points at a pooled endpoint (Neon
# "-pooler" host), set DB_DIRECT_URL to the direct endpoint. Defaults to the
# normal datasource URL when no separate direct endpoint exists.
spring.flyway.url=${DB_DIRECT_URL:${spring.datasource.url}}
spring.flyway.user=${DB_USERNAME:cookbook}
spring.flyway.password=${DB_PASSWORD:cookbook}

# ---------------------------------------------------------------
# CORS - comma separated list of allowed frontend origins
# ---------------------------------------------------------------
cookbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------
# Docker Compose: start compose.yaml together with the app.
# Must be false anywhere there is no local Docker daemon (cloud deploys).
# ---------------------------------------------------------------
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start_only
